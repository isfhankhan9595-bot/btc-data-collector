name: Import Collector From Btc-bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Clone original Btc-bot repository
        run: |
          git clone --depth 1 https://github.com/khanisfhan54-pixel/Btc-bot.git /tmp/Btc-bot

      - name: Replace destination with collector
        run: |
          set -e

          test -d /tmp/Btc-bot/collector

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a /tmp/Btc-bot/collector/. .

      - name: Verify imported structure
        run: |
          set -e

          test -f README.md
          test -f requirements.txt
          test -f run_collector.py

          test -d collector
          test -d collector/adapters
          test -d pipeline
          test -d scripts
          test -d tests

          test -f collector/__init__.py
          test -f collector/adapters/__init__.py
          test -f pipeline/__init__.py
          test -f scripts/__init__.py
          test -f tests/__init__.py

          echo "Collector structure verified successfully."

      - name: Commit imported collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"

          git add -A
          git commit -m "Import collector from Btc-bot"
          git push

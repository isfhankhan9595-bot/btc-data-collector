name: Import Collector From Btc-bot

on:
  workflow_dispatch:

# Prevent two copies of this importer workflow
# from modifying main at the same time.
concurrency:
  group: import-collector-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECK OUT DESTINATION REPOSITORY
      # ============================================================
      - name: Checkout destination repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ============================================================
      # 2. CLONE ORIGINAL BTC-BOT REPOSITORY
      # ============================================================
      - name: Clone original Btc-bot repository
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/khanisfhan54-pixel/Btc-bot.git \
            /tmp/Btc-bot

          test -d /tmp/Btc-bot/collector

          echo "Source repository cloned successfully."

      # ============================================================
      # 3. REPLACE DESTINATION CONTENT WITH COLLECTOR
      # ============================================================
      - name: Replace repository with collector package
        run: |
          set -e

          test -d /tmp/Btc-bot/collector

          # Remove existing repository content while preserving:
          # - .git
          # - .github
          # - .gitignore
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".gitignore" \
            -exec rm -rf {} +

          # IMPORTANT:
          # Copy the entire collector directory.
          # This preserves:
          #
          # btc-data-collector/
          # └── collector/
          #     ├── run_collector.py
          #     ├── collector/
          #     ├── pipeline/
          #     ├── scripts/
          #     └── tests/
          cp -a /tmp/Btc-bot/collector ./collector

          # Keep telegram_bot.py because collector imports it.
          if [ -f /tmp/Btc-bot/telegram_bot.py ]; then
            cp -a /tmp/Btc-bot/telegram_bot.py ./telegram_bot.py
          fi

          echo "Collector package imported successfully."

      # ============================================================
      # 4. VERIFY PACKAGE STRUCTURE
      # ============================================================
      - name: Verify package structure
        run: |
          set -e

          echo "Checking collector package structure..."

          # Top-level collector package
          test -f collector/__init__.py
          test -f collector/run_collector.py
          test -f collector/DAILY_COMPACTION.md
          test -f collector/README.md
          test -f collector/btc-collector.service
          test -f collector/conftest.py
          test -f collector/pytest.ini
          test -f collector/requirements.txt

          # Inner collector Python package
          test -d collector/collector
          test -f collector/collector/__init__.py

          # Adapters
          test -d collector/collector/adapters
          test -f collector/collector/adapters/__init__.py

          # Pipeline
          test -d collector/pipeline
          test -f collector/pipeline/__init__.py

          # Scripts
          test -d collector/scripts
          test -f collector/scripts/__init__.py

          # Tests
          test -d collector/tests
          test -f collector/tests/__init__.py

          # External Telegram dependency
          test -f telegram_bot.py

          echo "Package structure verification PASSED."

      # ============================================================
      # 5. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install -r collector/requirements.txt

          echo "Dependencies installed successfully."

      # ============================================================
      # 6. COMPILE PYTHON
      # ============================================================
      - name: Compile Python files
        run: |
          set -e

          python -m compileall -q collector

          python -m py_compile telegram_bot.py

          echo "Python compilation PASSED."

      # ============================================================
      # 7. TEST REQUIRED IMPORTS
      # ============================================================
      - name: Test Python imports
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/collector
        run: |
          set -e

          echo "Testing collector imports..."

          python -c "import collector"
          python -c "import collector.collector"
          python -c "import collector.collector.utils"
          python -c "import collector.collector.config"
          python -c "import collector.collector.adapters.binance"
          python -c "import collector.pipeline.dataset_assembler"
          python -c "import collector.scripts.verify_dataset"
          python -c "import telegram_bot"

          echo "All required imports PASSED."

      # ============================================================
      # 8. RUN COMPLETE TEST SUITE
      # ============================================================
      - name: Run complete test suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/collector
        run: |
          set -e

          pytest -q collector/tests

          echo "Complete collector test suite PASSED."

      # ============================================================
      # 9. REMOVE GENERATED ARTIFACTS
      # ============================================================
      - name: Remove generated files
        run: |
          set -e

          echo "Removing generated artifacts..."

          # Python cache directories
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          # Python bytecode
          find . \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          # Logs
          find . \
            -type f \
            -name "*.log" \
            -delete

          find . \
            -type d \
            -name "logs" \
            -prune \
            -exec rm -rf {} +

          # Pytest cache directories
          find . \
            -type d \
            -name ".pytest_cache" \
            -prune \
            -exec rm -rf {} +

          # Accidental ZIP archives
          find . \
            -type f \
            -name "*.zip" \
            -delete

          echo "Generated artifacts removed."

      # ============================================================
      # 10. VERIFY NO GENERATED ARTIFACTS REMAIN
      # ============================================================
      - name: Verify repository is clean
        run: |
          set -e

          echo "Checking for generated artifacts..."

          if find . \
            -type d \
            -name "__pycache__" \
            -print -quit | grep -q .; then

            echo "ERROR: __pycache__ directory still exists."
            find . -type d -name "__pycache__"
            exit 1
          fi

          if find . \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -print -quit | grep -q .; then

            echo "ERROR: Python bytecode files still exist."
            find . -type f \( -name "*.pyc" -o -name "*.pyo" \)
            exit 1
          fi

          if find . \
            -type f \
            -name "*.log" \
            -print -quit | grep -q .; then

            echo "ERROR: Log files still exist."
            find . -type f -name "*.log"
            exit 1
          fi

          if find . \
            -type d \
            -name "logs" \
            -print -quit | grep -q .; then

            echo "ERROR: logs directory still exists."
            find . -type d -name "logs"
            exit 1
          fi

          if find . \
            -type d \
            -name ".pytest_cache" \
            -print -quit | grep -q .; then

            echo "ERROR: .pytest_cache still exists."
            find . -type d -name ".pytest_cache"
            exit 1
          fi

          if find . \
            -type f \
            -name "*.zip" \
            -print -quit | grep -q .; then

            echo "ERROR: ZIP archive still exists."
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Generated-artifact verification PASSED."

      # ============================================================
      # 11. CREATE / UPDATE .gitignore
      # ============================================================
      - name: Create .gitignore
        run: |
          set -e

          cat > .gitignore <<'EOF'
          # Python bytecode
          __pycache__/
          *.py[cod]
          *$py.class

          # Pytest
          .pytest_cache/

          # Logs
          logs/
          *.log

          # Virtual environments
          .venv/
          venv/
          env/

          # IDE / editor files
          .vscode/
          .idea/

          # OS files
          .DS_Store
          Thumbs.db
          EOF

          echo ".gitignore created/updated."

      # ============================================================
      # 12. FINAL STRUCTURE VERIFICATION
      # ============================================================
      - name: Verify final repository
        run: |
          set -e

          echo "Performing final repository verification..."

          test -f .gitignore

          # Top-level collector package
          test -f collector/__init__.py
          test -f collector/run_collector.py
          test -f collector/requirements.txt
          test -f collector/pytest.ini

          # Inner collector package
          test -f collector/collector/__init__.py
          test -f collector/collector/utils.py
          test -f collector/collector/config.py

          # Other packages
          test -f collector/pipeline/__init__.py
          test -f collector/scripts/__init__.py
          test -f collector/tests/__init__.py

          # Telegram dependency
          test -f telegram_bot.py

          echo "Final repository verification PASSED."

      # ============================================================
      # 13. SYNCHRONIZE WITH LATEST REMOTE MAIN
      # ============================================================
      - name: Synchronize with latest remote main
        run: |
          set -e

          echo "Fetching latest origin/main..."

          git fetch origin main

          echo "Rebasing onto latest origin/main..."

          # The collector cleanup changes are currently uncommitted.
          # --autostash temporarily stores them while Git rebases.
          git pull --rebase --autostash origin main

          echo "Remote synchronization PASSED."

      # ============================================================
      # 14. STAGE AND COMMIT CHANGES
      # ============================================================
      - name: Commit corrected collector
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"

          echo "Staging final repository..."

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "Files staged for commit:"
          git diff --cached --name-status

          git commit -m "Clean generated collector artifacts"

          echo "Commit created successfully."

      # ============================================================
      # 15. PUSH TO MAIN
      # ============================================================
      - name: Push corrected collector
        run: |
          set -e

          echo "Pushing synchronized main branch..."

          git push origin HEAD:main

          echo "Changes committed and pushed successfully."
